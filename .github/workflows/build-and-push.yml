name: Build and push Docker image (self-contained)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          rm -rf repo || true
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} repo
          ls -la repo

      - name: Set up QEMU (for multi-arch)
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all || true

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use || true
          docker buildx inspect --bootstrap || true

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Logging in to ghcr.io"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          cd repo
          docker buildx build --platform linux/amd64 --push -t ghcr.io/${{ github.repository_owner }}/indirim:latest .
